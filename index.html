<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promesse Éternelle - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- QR Code & Firebase SDKs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-ivory: #faf9f6;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa771c;
            --text-dark: #333333;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
        }

        /* Classy Sparkles & Glowing Background Animation */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-ivory);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(170, 119, 28, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(243, 229, 171, 0.15) 0%, transparent 60%);
            color: var(--text-dark);
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Sparkle Effects floating around */
        body::before {
            content: "✨";
            position: fixed;
            top: 10%;
            left: 5%;
            font-size: 20px;
            opacity: 0.4;
            animation: floatSparkle 4s ease-in-out infinite alternate;
            z-index: -1;
        }
        body::after {
            content: "✨";
            position: fixed;
            bottom: 15%;
            right: 8%;
            font-size: 24px;
            opacity: 0.4;
            animation: floatSparkle 5s ease-in-out infinite alternate-reverse;
            z-index: -1;
        }

        @keyframes floatSparkle {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
            100% { transform: translateY(-15px) rotate(15deg); opacity: 0.7; }
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Top Header & Quick QR Toggle Box */
        .admin-header {
            background: var(--white);
            padding: 25px 30px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--gold-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 35px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--gold-dark);
            margin: 0 0 5px 0;
            font-size: 26px;
        }

        .stats {
            font-size: 14px;
            color: #666;
        }

        .qr-toggle-btn {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            color: var(--white);
            border: none;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            transition: transform 0.2s;
        }
        .qr-toggle-btn:hover {
            transform: scale(1.03);
        }

        /* Hidden QR Section that expands */
        .qr-card-section {
            background: var(--white);
            padding: 25px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--gold-light);
            max-width: 350px;
            margin: 0 auto 35px auto;
            text-align: center;
            display: none;
        }
        .qr-card-section h3 {
            font-family: 'Playfair Display', serif;
            color: var(--gold-dark);
            margin-top: 0;
        }
        #qrcode {
            margin: 15px auto;
            display: flex;
            justify-content: center;
        }
        .guest-link-text {
            font-size: 11px;
            color: #777;
            word-break: break-all;
            background: #fffcf5;
            padding: 8px;
            border-radius: 8px;
            border: 1px dashed var(--gold-primary);
            margin-top: 10px;
        }

        /* Dashboard Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--white);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--gold-light);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
        }

        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
            gap: 6px;
            padding: 12px;
            background: #fffcf5;
            max-height: 230px;
            overflow-y: auto;
            border-bottom: 1px solid var(--gold-light);
        }

        .photo-gallery img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #e6d5b8;
            transition: transform 0.2s, filter 0.2s;
        }
        .photo-gallery img:hover {
            transform: scale(1.04);
            filter: brightness(1.05);
        }

        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            font-size: 19px;
            color: var(--gold-dark);
            margin-bottom: 8px;
        }

        .card-text {
            font-size: 14px;
            color: #555;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .audio-player {
            width: 100%;
            margin: 10px 0;
            border-radius: 20px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f0e6d2;
            padding-top: 12px;
            font-size: 12px;
            color: #888;
            margin-top: auto;
        }

        .delete-btn {
            background: #ffebee;
            border: 1px solid #d32f2f;
            color: #d32f2f;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            transition: background 0.2s, color 0.2s;
        }
        .delete-btn:hover {
            background: #d32f2f;
            color: white;
        }

        .no-data {
            text-align: center;
            grid-column: 1 / -1;
            color: #777;
            font-size: 16px;
            margin-top: 50px;
            background: var(--white);
            padding: 40px;
            border-radius: 20px;
            border: 1px dashed var(--gold-primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Header Bar -->
        <div class="admin-header">
            <div>
                <h1>✨ Promesse Éternelle Admin</h1>
                <div class="stats" id="statsCount">Syncing with cloud memories...</div>
            </div>
            <button class="qr-toggle-btn" onclick="toggleQRSection()">📱 Show Guest QR Code</button>
        </div>

        <!-- Collapsible QR Code Box for Quick Reference -->
        <div id="qrSection" class="qr-card-section">
            <h3>Guest QR Code</h3>
            <p style="font-size: 12px; color: #666; margin-bottom: 10px;">Scan this or share the link with guests for uploads.</p>
            <div id="qrcode"></div>
            <div class="guest-link-text" id="guestUrlText">Loading link...</div>
        </div>

        <!-- Live Memories Grid -->
        <div class="grid-container" id="dashboardGrid"></div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: ["AIzaSyAdlmEH", "OHwsnQFcwfUpCNk", "HVCNzYlnoUqw"].join(''),
            authDomain: "promesse-eternele-memories.firebaseapp.com",
            projectId: "promesse-eternele-memories",
            storageBucket: "promesse-eternele-memories.firebasestorage.app",
            messagingSenderId: "142304243061",
            appId: "1:142304243061:web:9faefd4e25106bce6c373c",
            measurementId: "G-QHCZ92NDTZ"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Toggle QR Code Box visibility & generate QR dynamically
        let qrGenerated = false;
        function toggleQRSection() {
            const section = document.getElementById('qrSection');
            if (section.style.display === 'block') {
                section.style.display = 'none';
            } else {
                section.style.display = 'block';
                if (!qrGenerated) {
                    generateQR();
                    qrGenerated = true;
                }
            }
        }

        function generateQR() {
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = "";
            
            // NOTE: Yahan aap apni Guest website ka live link (GitHub Pages URL) dal sakti hain jab wo deploy ho jaye
            // Abhi ke liye yeh current domain ka base link utha raha hai
            const guestUrl = window.location.href.replace('admin.html', 'index.html');
            document.getElementById('guestUrlText').innerText = guestUrl;
            
            new QRCode(qrContainer, {
                text: guestUrl,
                width: 160,
                height: 160,
                colorDark: "#aa771c",
                colorLight: "#faf9f6",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        // Open Full Size Photo in a clean popup window
        function openFullPhoto(base64Data) {
            const win = window.open();
            win.document.write(`
                <html>
                    <head><title>Full Size Memory Photo</title></head>
                    <body style="margin:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh;">
                        <img src="${base64Data}" style="max-width:100%; max-height:100%; object-fit:contain;">
                    </body>
                </html>
            `);
        }

        // Delete Memory Function from Firestore
        async function deleteMemory(docId) {
            if (confirm("Kya aap sach mein is memory ko delete karna chahti hain?")) {
                try {
                    await db.collection("memories").doc(docId).delete();
                } catch (error) {
                    console.error("Error deleting memory: ", error);
                    alert("Delete karne mein kuch error aaya!");
                }
            }
        }

        // Real-Time Dashboard Sync Loader
        function loadLiveDashboard() {
            const grid = document.getElementById('dashboardGrid');
            const stats = document.getElementById('statsCount');

            db.collection("memories").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                stats.innerHTML = `Total memories received: <b>${snapshot.size}</b>`;

                                if (snapshot.empty) {
                    grid.innerHTML = `<div class="no-data">💌 No memories received yet. As soon as guests upload via the QR code, they will appear here live! ✨</div>`;
                    return;
                }


                grid.innerHTML = "";
                snapshot.forEach(doc => {
                    const item = doc.data();
                    const docId = doc.id;
                    const dateStr = item.createdAt ? item.createdAt.toDate().toLocaleString() : "Just now";

                    let photosHtml = "";
                    if (item.images && item.images.length > 0) {
                        photosHtml = `<div class="photo-gallery">`;
                        item.images.forEach(imgBase64 => {
                            photosHtml += `<img src="${imgBase64}" alt="Memory Photo" onclick="openFullPhoto('${imgBase64}')">`;
                        });
                        photosHtml += `</div>`;
                    }

                    let audioHtml = item.audio ? `<audio controls class="audio-player" src="${item.audio}"></audio>` : ``;

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        ${photosHtml}
                        <div class="card-content">
                            <div class="card-title">${escapeHtml(item.name)}</div>
                            <div class="card-text">${item.message ? '"' + escapeHtml(item.message) + '"' : '<span style="color:#aaa; font-style:italic;">No text message provided</span>'}</div>
                            ${audioHtml}
                            <div class="card-footer">
                                <span>${dateStr}</span>
                                <button onclick="deleteMemory('${docId}')" class="delete-btn">🗑️ Delete</button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            });
        }

        function escapeHtml(text) {
            if(!text) return "";
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Initialize dashboard sync on load
        loadLiveDashboard();
    </script>
</body>
</html>
